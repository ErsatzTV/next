name: Advisories
on:
  # new RustSec advisories land without any change here, so pr.yml alone misses them
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Check Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      - name: Check Advisories
        run: cargo deny --locked check advisories
