name: Build & Publish to Docker Hub
on:
  workflow_call:
    inputs:
      base_version:
        description: 'Base version (latest or develop)'
        required: true
        type: string
      info_version:
        description: 'Informational version number (e.g. 0.3.7-alpha)'
        required: true
        type: string
      tag_version:
        description: 'Docker tag version (e.g. v0.3.7)'
        required: true
        type: string
    secrets:
      docker_hub_username:
        required: true
      docker_hub_access_token:
        required: true
jobs:
  build_images:
    name: Build ${{ matrix.name }} images
    runs-on: ${{ matrix.os }}
    if: contains(github.event.head_commit.message, '[no build]') == false
    strategy:
      matrix:
        include:
          - name: amd64
            os: ubuntu-latest
            suffix: '-amd64'
            platform: 'linux/amd64'
            extra_cache: ''
          # Cross-compiled on amd64, so the toolchain layers match the amd64 cache.
          - name: arm32v7
            os: ubuntu-latest
            suffix: '-arm'
            platform: 'linux/arm/v7'
            extra_cache: 'type=gha,scope=next-amd64'
          - name: arm64
            os: ubuntu-24.04-arm
            suffix: '-arm64'
            platform: 'linux/arm64'
            extra_cache: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Rust is cross-compiled. QEMU runs only the ARMv7 image setup and smoke test.
      - name: Set up QEMU
        if: matrix.name == 'arm32v7'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_access_token }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: runtime
          push: true
          provenance: false
          platforms: ${{ matrix.platform }}
          cache-from: |
            type=gha,scope=next-${{ matrix.name }}
            type=gha,scope=next-test-${{ matrix.name }}
            ${{ matrix.extra_cache }}
          cache-to: type=gha,mode=max,scope=next-${{ matrix.name }}
          build-args: |
            INFO_VERSION=${{ inputs.info_version }}-docker${{ matrix.suffix }}
          outputs: |
            type=image,name=ersatztv/next,name-canonical=true,push-by-digest=true
            type=image,name=ghcr.io/ersatztv/next,name-canonical=true,push-by-digest=true

      - name: Save Digest to Artifact
        run: echo ${{ steps.build.outputs.digest }} > digest-${{ matrix.name }}.txt

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt

      - name: Build and push test image by digest
        id: test-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: test-runtime
          push: true
          provenance: false
          platforms: ${{ matrix.platform }}
          cache-from: |
            type=gha,scope=next-test-${{ matrix.name }}
            type=gha,scope=next-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=next-test-${{ matrix.name }}
          outputs: |
            type=image,name=ersatztv/next-test,name-canonical=true,push-by-digest=true
            type=image,name=ghcr.io/ersatztv/next-test,name-canonical=true,push-by-digest=true

      - name: Save Digest to Artifact
        run: echo ${{ steps.test-build.outputs.digest }} > digest-${{ matrix.name }}.txt

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt

      - name: Smoke test images
        timeout-minutes: 5
        env:
          PLATFORM: ${{ matrix.platform }}
          APP_IMAGE: ghcr.io/ersatztv/next@${{ steps.build.outputs.digest }}
          TEST_IMAGE: ghcr.io/ersatztv/next-test@${{ steps.test-build.outputs.digest }}
        run: sh docker/smoke-test.sh "$PLATFORM" "$APP_IMAGE" "$TEST_IMAGE"

  merge_manifests:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: build_images
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_access_token }}

      - name: Log in to the Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Digest Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests/

      - name: Read Digests From Artifacts
        id: digests
        run: |
          AMD64_HASH=$(cat digests/digest-amd64.txt)
          ARM32V7_HASH=$(cat digests/digest-arm32v7.txt)
          ARM64_HASH=$(cat digests/digest-arm64.txt)

          DOCKER_HUB_DIGESTS="ersatztv/next@${AMD64_HASH} ersatztv/next@${ARM64_HASH} ersatztv/next@${ARM32V7_HASH}"
          GHCR_DIGESTS="ghcr.io/ersatztv/next@${AMD64_HASH} ghcr.io/ersatztv/next@${ARM64_HASH} ghcr.io/ersatztv/next@${ARM32V7_HASH}"

          echo "docker_hub_digests=${DOCKER_HUB_DIGESTS}" >> "$GITHUB_OUTPUT"
          echo "ghcr_digests=${GHCR_DIGESTS}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Manifests
        run: |
          docker manifest create ersatztv/next:${{ inputs.base_version }} ${{ steps.digests.outputs.docker_hub_digests }}
          docker manifest push ersatztv/next:${{ inputs.base_version }}
          docker manifest create ersatztv/next:${{ inputs.tag_version }} ${{ steps.digests.outputs.docker_hub_digests }}
          docker manifest push ersatztv/next:${{ inputs.tag_version }}

          docker manifest create ghcr.io/ersatztv/next:${{ inputs.base_version }} ${{ steps.digests.outputs.ghcr_digests }}
          docker manifest push ghcr.io/ersatztv/next:${{ inputs.base_version }}
          docker manifest create ghcr.io/ersatztv/next:${{ inputs.tag_version }} ${{ steps.digests.outputs.ghcr_digests }}
          docker manifest push ghcr.io/ersatztv/next:${{ inputs.tag_version }}

  merge_test_manifests:
    name: Merge Test Manifests
    runs-on: ubuntu-latest
    needs: build_images
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_access_token }}

      - name: Log in to the Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Digest Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: test-digest-*
          merge-multiple: true
          path: digests/

      - name: Read Digests From Artifacts
        id: digests
        run: |
          AMD64_HASH=$(cat digests/digest-amd64.txt)
          ARM32V7_HASH=$(cat digests/digest-arm32v7.txt)
          ARM64_HASH=$(cat digests/digest-arm64.txt)

          DOCKER_HUB_DIGESTS="ersatztv/next-test@${AMD64_HASH} ersatztv/next-test@${ARM64_HASH} ersatztv/next-test@${ARM32V7_HASH}"
          GHCR_DIGESTS="ghcr.io/ersatztv/next-test@${AMD64_HASH} ghcr.io/ersatztv/next-test@${ARM64_HASH} ghcr.io/ersatztv/next-test@${ARM32V7_HASH}"

          echo "docker_hub_digests=${DOCKER_HUB_DIGESTS}" >> "$GITHUB_OUTPUT"
          echo "ghcr_digests=${GHCR_DIGESTS}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Manifests
        run: |
          docker manifest create ersatztv/next-test:${{ inputs.base_version }} ${{ steps.digests.outputs.docker_hub_digests }}
          docker manifest push ersatztv/next-test:${{ inputs.base_version }}
          docker manifest create ersatztv/next-test:${{ inputs.tag_version }} ${{ steps.digests.outputs.docker_hub_digests }}
          docker manifest push ersatztv/next-test:${{ inputs.tag_version }}

          docker manifest create ghcr.io/ersatztv/next-test:${{ inputs.base_version }} ${{ steps.digests.outputs.ghcr_digests }}
          docker manifest push ghcr.io/ersatztv/next-test:${{ inputs.base_version }}
          docker manifest create ghcr.io/ersatztv/next-test:${{ inputs.tag_version }} ${{ steps.digests.outputs.ghcr_digests }}
          docker manifest push ghcr.io/ersatztv/next-test:${{ inputs.tag_version }}
