name: Build & Publish to Docker Hub
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag, also the per-build docker tag (e.g. v0.2.0 or v0.2.1-f8410286-develop)'
        required: true
        type: string
      publish:
        description: 'Push the images and tag them; false only builds and smoke tests them'
        required: true
        type: boolean
    secrets:
      docker_hub_username:
        required: false
      docker_hub_access_token:
        required: false
jobs:
  build_images:
    name: Build ${{ matrix.name }} images
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: amd64
            os: ubuntu-latest
            platform: 'linux/amd64'
          - name: arm64
            os: ubuntu-24.04-arm
            platform: 'linux/arm64'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate informational version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: echo "info_version=${TAG#v}+docker-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_access_token }}

      - name: Log in to the Container registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        if: inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: runtime
          push: true
          provenance: false
          platforms: ${{ matrix.platform }}
          cache-from: |
            type=gha,scope=next-${{ matrix.name }}
            type=gha,scope=next-test-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=next-${{ matrix.name }}
          build-args: |
            INFO_VERSION=${{ steps.version.outputs.info_version }}
          outputs: |
            type=image,name=ersatztv/next,name-canonical=true,push-by-digest=true
            type=image,name=ghcr.io/ersatztv/next,name-canonical=true,push-by-digest=true

      # unpublished images can't be pulled by digest, so the smoke test runs them from the local daemon
      - name: Build for smoke test
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: runtime
          load: true
          tags: ersatztv/next:ci
          provenance: false
          platforms: ${{ matrix.platform }}
          cache-from: |
            type=gha,scope=next-${{ matrix.name }}
            type=gha,scope=next-test-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=next-${{ matrix.name }}
          build-args: |
            INFO_VERSION=${{ steps.version.outputs.info_version }}

      - name: Save Digest to Artifact
        if: inputs.publish
        run: echo ${{ steps.build.outputs.digest }} > digest-${{ matrix.name }}.txt

      - name: Upload Digest Artifact
        if: inputs.publish
        uses: actions/upload-artifact@v6
        with:
          name: next-digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt

      - name: Build and push test image by digest
        id: test-build
        if: inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: test-runtime
          push: true
          provenance: false
          platforms: ${{ matrix.platform }}
          cache-from: |
            type=gha,scope=next-test-${{ matrix.name }}
            type=gha,scope=next-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=next-test-${{ matrix.name }}
          outputs: |
            type=image,name=ersatztv/next-test,name-canonical=true,push-by-digest=true
            type=image,name=ghcr.io/ersatztv/next-test,name-canonical=true,push-by-digest=true

      - name: Build test image for smoke test
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: test-runtime
          load: true
          tags: ersatztv/next-test:ci
          provenance: false
          platforms: ${{ matrix.platform }}
          cache-from: |
            type=gha,scope=next-test-${{ matrix.name }}
            type=gha,scope=next-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=next-test-${{ matrix.name }}

      - name: Save Digest to Artifact
        if: inputs.publish
        run: echo ${{ steps.test-build.outputs.digest }} > digest-${{ matrix.name }}.txt

      - name: Upload Digest Artifact
        if: inputs.publish
        uses: actions/upload-artifact@v6
        with:
          name: next-test-digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt

      - name: Smoke test images
        timeout-minutes: 5
        env:
          PLATFORM: ${{ matrix.platform }}
          APP_IMAGE: ${{ inputs.publish && format('ghcr.io/ersatztv/next@{0}', steps.build.outputs.digest) || 'ersatztv/next:ci' }}
          TEST_IMAGE: ${{ inputs.publish && format('ghcr.io/ersatztv/next-test@{0}', steps.test-build.outputs.digest) || 'ersatztv/next-test:ci' }}
        run: sh docker/smoke-test.sh "$PLATFORM" "$APP_IMAGE" "$TEST_IMAGE"

  merge_manifests:
    name: Merge ${{ matrix.image }} manifests
    runs-on: ubuntu-latest
    needs: build_images
    if: inputs.publish
    strategy:
      matrix:
        image: [next, next-test]
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_access_token }}

      - name: Log in to the Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Digest Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.image }}-digest-*
          merge-multiple: true
          path: digests/

      - name: Create and Push Manifests
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags=(latest "$TAG")
            # floating vX.Y follows compatible updates; next-test is only pulled by exact tag
            [[ "$IMAGE" == next ]] && tags+=("v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{8}-develop$ ]]; then
            tags=(develop "$TAG")
          else
            echo "unrecognized tag '$TAG'" >&2
            exit 1
          fi

          amd64="$(cat digests/digest-amd64.txt)"
          arm64="$(cat digests/digest-arm64.txt)"
          for repo in "ersatztv/$IMAGE" "ghcr.io/ersatztv/$IMAGE"; do
            for tag in "${tags[@]}"; do
              docker manifest create "$repo:$tag" "$repo@$amd64" "$repo@$arm64"
              docker manifest push "$repo:$tag"
            done
          done
